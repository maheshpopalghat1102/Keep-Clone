services:
  - type: web
    name: keep-clone-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://keep-clone-frontend.onrender.com
      - key: CLIENT_URLS
        value: https://keep-clone-frontend.onrender.com,http://localhost:5173
      - key: JWT_EXPIRE
        value: 30d
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: keep-clone-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        value: https://keep-clone-k5h2.onrender.com/api
